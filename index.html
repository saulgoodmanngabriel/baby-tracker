<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FF9F43">
    <title>番茄记录仪</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            padding-bottom: 100px;
        }
        .header {
            background: linear-gradient(135deg, #FF9F43 0%, #FF6B6B 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header .date { font-size: 14px; opacity: 0.9; margin-top: 4px; }
        
        .date-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 8px;
        }
        .date-nav button {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }
        .date-nav button:active { background: rgba(255,255,255,0.5); }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px;
        }
        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-value { font-size: 28px; font-weight: bold; color: #333; }
        .stat-label { font-size: 12px; color: #999; margin-top: 4px; }
        .stat-value.milk { color: #FF9F43; }
        .stat-value.diaper { color: #45B7D1; }
        .stat-value.feed { color: #4ECDC4; }
        
        .section {
            background: white;
            margin: 12px 16px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .icon { font-size: 20px; }
        
        .timeline {
            position: relative;
            padding-left: 24px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e0e0e0;
        }
        .event {
            position: relative;
            padding: 10px 0 10px 16px;
            border-left: 3px solid;
            margin-bottom: 6px;
            border-radius: 0 8px 8px 0;
            background: #fafafa;
        }
        .event::before {
            content: '';
            position: absolute;
            left: -23px;
            top: 14px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            border: 2px solid;
            border-color: inherit;
        }
        .event-time { font-size: 13px; color: #999; }
        .event-label { font-size: 15px; font-weight: 500; margin-top: 2px; }
        .event-note { font-size: 12px; color: #999; margin-top: 2px; }
        
        .formula { border-left-color: #FF9F43; }
        .formula::before { border-color: #FF9F43; }
        .formula .event-label { color: #FF9F43; }
        
        .breast { border-left-color: #FF6B6B; }
        .breast::before { border-color: #FF6B6B; }
        .breast .event-label { color: #FF6B6B; }
        
        .direct { border-left-color: #4ECDC4; }
        .direct::before { border-color: #4ECDC4; }
        .direct .event-label { color: #4ECDC4; }
        
        .poo { border-left-color: #96CEB4; }
        .poo::before { border-color: #96CEB4; }
        .poo .event-label { color: #96CEB4; }
        
        .pee { border-left-color: #45B7D1; }
        .pee::before { border-color: #45B7D1; }
        .pee .event-label { color: #45B7D1; }
        
        .both { border-left-color: #FFEAA7; }
        .both::before { border-color: #FFEAA7; }
        .both .event-label { color: #d4a017; }
        
        .diaper-change { border-left-color: #DDA0DD; }
        .diaper-change::before { border-color: #DDA0DD; }
        .diaper-change .event-label { color: #DDA0DD; }
        
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF9F43 0%, #FF6B6B 100%);
            color: white;
            border: none;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
            cursor: pointer;
            z-index: 1000;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: flex-end;
            flex-direction: column;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        .type-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .type-btn {
            padding: 16px;
            border-radius: 16px;
            border: 2px solid #eee;
            background: white;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .type-btn:active { transform: scale(0.95); }
        .type-btn.selected {
            border-color: #FF9F43;
            background: #FFF5EE;
        }
        .type-btn .emoji { font-size: 28px; display: block; margin-bottom: 4px; }
        .type-btn .label { font-size: 13px; color: #666; }
        
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 16px;
            -webkit-appearance: none;
        }
        .input-group input:focus {
            outline: none;
            border-color: #FF9F43;
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #FF9F43 0%, #FF6B6B 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary:active { opacity: 0.9; }
        
        .btn-cancel {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: #f5f5f5;
            color: #666;
            font-size: 16px;
            margin-top: 8px;
            cursor: pointer;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }
        
        .export-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: white;
            color: #FF9F43;
            border: 2px solid #FF9F43;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .voice-btn {
            position: fixed;
            bottom: 96px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: white;
            color: #FF6B6B;
            border: 2px solid #FF6B6B;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .voice-btn:active { transform: scale(0.95); }
        .voice-btn.recording {
            background: #FF6B6B;
            color: white;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }
        
        .voice-status {
            position: fixed;
            bottom: 160px;
            right: 24px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }
        .voice-status.active { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 番茄记录仪</h1>
        <div class="date-nav">
            <button onclick="changeDate(-1)">◀</button>
            <div class="date" id="currentDate">2026年5月29日</div>
            <button onclick="changeDate(1)">▶</button>
        </div>
    </div>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-value feed" id="feedCount">0</div>
            <div class="stat-label">喂奶次数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value milk" id="totalMilk">0ml</div>
            <div class="stat-label">总奶量</div>
        </div>
        <div class="stat-card">
            <div class="stat-value diaper" id="diaperCount">0</div>
            <div class="stat-label">排便/换尿布</div>
        </div>
    </div>
    
    <div class="section">
        <div class="section-title">
            <span class="icon">🍼</span>
            喂奶记录
        </div>
        <div class="timeline" id="feedingTimeline">
            <div class="empty-state">
                <div class="emoji">🍼</div>
                <p>今天还没有喂奶记录</p>
            </div>
        </div>
    </div>
    
    <div class="section">
        <div class="section-title">
            <span class="icon">💩</span>
            排便记录
        </div>
        <div class="timeline" id="diaperTimeline">
            <div class="empty-state">
                <div class="emoji">💩</div>
                <p>今天还没有排便记录</p>
            </div>
        </div>
    </div>
    
    <button class="export-btn" onclick="exportData()" title="导出数据">📤</button>
    <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="语音输入">🎤</button>
    <div class="voice-status" id="voiceStatus">点击开始语音...</div>
    <button class="fab" onclick="showModal()">+</button>
    
    <div class="modal" id="recordModal">
        <div class="modal-content">
            <div class="modal-title">记录新事件</div>
            
            <div class="type-grid">
                <div class="type-btn" data-type="formula" onclick="selectType(this)">
                    <span class="emoji">🍼</span>
                    <span class="label">奶粉</span>
                </div>
                <div class="type-btn" data-type="breast" onclick="selectType(this)">
                    <span class="emoji">🤱</span>
                    <span class="label">母乳瓶喂</span>
                </div>
                <div class="type-btn" data-type="direct" onclick="selectType(this)">
                    <span class="emoji">👩‍🍼</span>
                    <span class="label">亲喂</span>
                </div>
                <div class="type-btn" data-type="poo" onclick="selectType(this)">
                    <span class="emoji">💩</span>
                    <span class="label">大便</span>
                </div>
                <div class="type-btn" data-type="pee" onclick="selectType(this)">
                    <span class="emoji">💧</span>
                    <span class="label">小便</span>
                </div>
                <div class="type-btn" data-type="both" onclick="selectType(this)">
                    <span class="emoji">💩💧</span>
                    <span class="label">大小便</span>
                </div>
                <div class="type-btn" data-type="diaper-change" onclick="selectType(this)">
                    <span class="emoji">🩲</span>
                    <span class="label">换尿布</span>
                </div>
            </div>
            
            <div class="input-group" id="amountGroup" style="display:none;">
                <label id="amountLabel">奶量（ml）</label>
                <input type="number" id="amountInput" placeholder="输入数值...">
            </div>
            
            <div class="input-group">
                <label>时间（可选，默认现在）</label>
                <input type="time" id="timeInput">
            </div>
            
            <div class="input-group">
                <label>备注（可选）</label>
                <input type="text" id="noteInput" placeholder="例如：左侧、睡前奶...">
            </div>
            
            <button class="btn-primary" onclick="saveRecord()">保存记录</button>
            <button class="btn-cancel" onclick="hideModal()">取消</button>
        </div>
    </div>

    <script>
        // Data storage
        let records = JSON.parse(localStorage.getItem('babyRecords') || '[]');
        let selectedType = null;
        let currentViewDate = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateDate();
            renderRecords();
            updateStats();
        });
        
        function updateDate() {
            const [year, month, day] = currentViewDate.split('-');
            document.getElementById('currentDate').textContent = `${year}年${month}月${day}日`;
        }
        
        function changeDate(offset) {
            const date = new Date(currentViewDate);
            date.setDate(date.getDate() + offset);
            currentViewDate = date.toISOString().split('T')[0];
            updateDate();
            renderRecords();
            updateStats();
        }
        
        function showModal() {
            document.getElementById('recordModal').classList.add('active');
            // Set default time to now
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('timeInput').value = timeStr;
        }
        
        function hideModal() {
            document.getElementById('recordModal').classList.remove('active');
            selectedType = null;
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('amountInput').value = '';
            document.getElementById('noteInput').value = '';
            document.getElementById('amountGroup').style.display = 'none';
        }
        
        function selectType(btn) {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedType = btn.dataset.type;
            
            // Show/hide amount input based on type
            const amountGroup = document.getElementById('amountGroup');
            const amountLabel = document.getElementById('amountLabel');
            
            if (selectedType === 'formula' || selectedType === 'breast') {
                amountGroup.style.display = 'block';
                amountLabel.textContent = '奶量（ml）';
            } else if (selectedType === 'direct') {
                amountGroup.style.display = 'block';
                amountLabel.textContent = '时长（分钟）';
            } else {
                amountGroup.style.display = 'none';
            }
        }
        
        function saveRecord() {
            if (!selectedType) {
                alert('请选择记录类型');
                return;
            }
            
            const timeInput = document.getElementById('timeInput').value;
            const amount = document.getElementById('amountInput').value;
            const note = document.getElementById('noteInput').value;
            
            const time = timeInput || new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
            
            const typeLabels = {
                'formula': { label: '奶粉', unit: 'ml', category: 'feeding', class: 'formula' },
                'breast': { label: '母乳瓶喂', unit: 'ml', category: 'feeding', class: 'breast' },
                'direct': { label: '亲喂', unit: '分钟', category: 'feeding', class: 'direct' },
                'poo': { label: '大便', unit: '', category: 'diaper', class: 'poo' },
                'pee': { label: '小便', unit: '', category: 'diaper', class: 'pee' },
                'both': { label: '大小便', unit: '', category: 'diaper', class: 'both' },
                'diaper-change': { label: '换尿布', unit: '', category: 'diaper', class: 'diaper-change' }
            };
            
            const typeInfo = typeLabels[selectedType];
            const record = {
                id: Date.now(),
                time: time,
                type: selectedType,
                label: typeInfo.label,
                amount: amount,
                unit: typeInfo.unit,
                note: note,
                category: typeInfo.category,
                class: typeInfo.class,
                date: currentViewDate
            };
            
            records.push(record);
            localStorage.setItem('babyRecords', JSON.stringify(records));
            
            renderRecords();
            updateStats();
            hideModal();
        }
        
        function renderRecords() {
            const dayRecords = records.filter(r => r.date === currentViewDate);
            
            const feedings = dayRecords.filter(r => r.category === 'feeding').sort((a,b) => a.time.localeCompare(b.time));
            const diapers = dayRecords.filter(r => r.category === 'diaper').sort((a,b) => a.time.localeCompare(b.time));
            
            // Render feedings
            const feedingContainer = document.getElementById('feedingTimeline');
            if (feedings.length === 0) {
                feedingContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">🍼</div>
                        <p>这一天还没有喂奶记录</p>
                    </div>`;
            } else {
                feedingContainer.innerHTML = feedings.map(r => `
                    <div class="event ${r.class}">
                        <div class="event-time">${r.time}</div>
                        <div class="event-label">${r.label} ${r.amount ? r.amount + r.unit : ''}</div>
                        ${r.note ? `<div class="event-note">${r.note}</div>` : ''}
                    </div>
                `).join('');
            }
            
            // Render diapers
            const diaperContainer = document.getElementById('diaperTimeline');
            if (diapers.length === 0) {
                diaperContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">💩</div>
                        <p>这一天还没有排便记录</p>
                    </div>`;
            } else {
                diaperContainer.innerHTML = diapers.map(r => `
                    <div class="event ${r.class}">
                        <div class="event-time">${r.time}</div>
                        <div class="event-label">${r.label}</div>
                        ${r.note ? `<div class="event-note">${r.note}</div>` : ''}
                    </div>
                `).join('');
            }
        }
        
        function updateStats() {
            const dayRecords = records.filter(r => r.date === currentViewDate);
            
            // Group feedings by time for counting sessions
            const feedings = dayRecords.filter(r => r.category === 'feeding');
            const uniqueTimes = new Set(feedings.map(r => r.time));
            const feedCount = uniqueTimes.size;
            
            const totalMl = feedings.reduce((sum, r) => {
                if (r.unit === 'ml') return sum + (parseInt(r.amount) || 0);
                return sum;
            }, 0);
            
            const diapers = dayRecords.filter(r => r.category === 'diaper');
            
            document.getElementById('feedCount').textContent = feedCount;
            document.getElementById('totalMilk').textContent = totalMl + 'ml';
            document.getElementById('diaperCount').textContent = diapers.length;
        }
        
        function exportData() {
            const data = JSON.stringify(records, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `baby-records-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            // Also show as text for copying
            alert('数据已导出！你也可以复制以下数据发送给 Hermes 生成报告：\n\n' + data.substring(0, 500) + '...');
        }
        
        // Voice recognition
        let recognition = null;
        let isRecording = false;
        
        function initVoice() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = false;
                recognition.interimResults = false;
                
                recognition.onstart = function() {
                    isRecording = true;
                    document.getElementById('voiceBtn').classList.add('recording');
                    document.getElementById('voiceStatus').textContent = '正在听...';
                    document.getElementById('voiceStatus').classList.add('active');
                };
                
                recognition.onend = function() {
                    isRecording = false;
                    document.getElementById('voiceBtn').classList.remove('recording');
                    document.getElementById('voiceStatus').classList.remove('active');
                };
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    console.log('语音识别结果:', transcript);
                    document.getElementById('voiceStatus').textContent = '识别: ' + transcript;
                    document.getElementById('voiceStatus').classList.add('active');
                    
                    // Add a small delay to show the recognized text before processing
                    setTimeout(() => {
                        parseVoiceInput(transcript);
                    }, 500);
                };
                
                recognition.onerror = function(event) {
                    console.error('语音识别错误:', event.error);
                    let errorMsg = '识别失败';
                    
                    // iOS Safari specific errors
                    if (event.error === 'not-allowed') {
                        errorMsg = '请允许麦克风权限';
                    } else if (event.error === 'no-speech') {
                        errorMsg = '没有听到声音，请重试';
                    } else if (event.error === 'network') {
                        errorMsg = '网络错误，请检查连接';
                    } else if (event.error === 'aborted') {
                        errorMsg = '识别已取消';
                    } else {
                        errorMsg = '识别失败: ' + event.error;
                    }
                    
                    document.getElementById('voiceStatus').textContent = '❌ ' + errorMsg;
                    setTimeout(() => {
                        document.getElementById('voiceStatus').classList.remove('active');
                    }, 3000);
                };
            } else {
                document.getElementById('voiceBtn').style.display = 'none';
                console.log('浏览器不支持语音识别');
            }
        }
        
        function toggleVoice() {
            if (!recognition) {
                alert('您的浏览器不支持语音识别，请使用 Safari 或 Chrome');
                return;
            }
            
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }
        
        function parseVoiceInput(text) {
            // Parse natural language input with time extraction
            text = text.trim().toLowerCase();
            
            let record = null;
            
            // Extract time from text
            let timeStr = extractTimeFromText(text);
            if (!timeStr) {
                // Default to current time if no time found
                const now = new Date();
                timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            }
            
            // Extract date from text (e.g., "昨天", "前天", "5月30号")
            let dateStr = extractDateFromText(text);
            if (!dateStr) {
                dateStr = currentViewDate;
            }
            
            // Extract number from text
            const numMatch = text.match(/(\d+)/);
            const amount = numMatch ? numMatch[1] : '';
            
            // Priority matching: more specific patterns first
            if (text.includes('奶粉')) {
                record = { type: 'formula', label: '奶粉', amount: amount + 'ml', unit: 'ml', category: 'feeding', class: 'formula' };
            } else if (text.includes('瓶喂') || (text.includes('母乳') && amount)) {
                record = { type: 'breast', label: '母乳瓶喂', amount: amount + 'ml', unit: 'ml', category: 'feeding', class: 'breast' };
            } else if (text.includes('亲喂')) {
                record = { type: 'direct', label: '亲喂', amount: amount + '分钟', unit: '分钟', category: 'feeding', class: 'direct' };
            } else if (text.includes('喂奶') && amount) {
                // Generic "喂奶" - check if number is likely ml (bigger numbers = ml)
                const num = parseInt(amount);
                if (num >= 30) {
                    record = { type: 'formula', label: '奶粉', amount: amount + 'ml', unit: 'ml', category: 'feeding', class: 'formula' };
                } else {
                    record = { type: 'direct', label: '亲喂', amount: amount + '分钟', unit: '分钟', category: 'feeding', class: 'direct' };
                }
            }
            
            // Diaper patterns
            if (!record) {
                if (text.includes('大小便')) {
                    record = { type: 'both', label: '大小便', amount: '', unit: '', category: 'diaper', class: 'both' };
                } else if (text.includes('大便')) {
                    record = { type: 'poo', label: '大便', amount: '', unit: '', category: 'diaper', class: 'poo' };
                } else if (text.includes('小便')) {
                    record = { type: 'pee', label: '小便', amount: '', unit: '', category: 'diaper', class: 'pee' };
                } else if (text.includes('换尿布') || text.includes('尿布')) {
                    record = { type: 'diaper-change', label: '换尿布', amount: '', unit: '', category: 'diaper', class: 'diaper-change' };
                }
            }
            
            if (record) {
                record.id = Date.now();
                record.time = timeStr;
                record.note = '';
                record.date = dateStr;
                
                records.push(record);
                localStorage.setItem('babyRecords', JSON.stringify(records));
                
                // If recording for a different date, switch to that date
                if (dateStr !== currentViewDate) {
                    currentViewDate = dateStr;
                    updateDate();
                }
                
                renderRecords();
                updateStats();
                
                // Show success feedback
                const dateDisplay = dateStr === new Date().toISOString().split('T')[0] ? '' : ` (${dateStr})`;
                document.getElementById('voiceStatus').textContent = `✅ 已记录${dateDisplay}: ${record.label} ${record.amount}`;
                setTimeout(() => {
                    document.getElementById('voiceStatus').classList.remove('active');
                }, 2000);
                
                // Speak feedback (optional)
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(`已记录${record.label}${record.amount}`);
                    utterance.lang = 'zh-CN';
                    speechSynthesis.speak(utterance);
                }
            } else {
                document.getElementById('voiceStatus').textContent = '❌ 无法识别，请重试';
                setTimeout(() => {
                    document.getElementById('voiceStatus').classList.remove('active');
                }, 2000);
            }
        }
        
        function extractTimeFromText(text) {
            // Match patterns like "14:30", "下午3点", "3点半", "15点", "3点15"
            
            // Direct time format: 14:30, 14点30
            const directMatch = text.match(/(\d{1,2})[:\u70b9](\d{2})/);
            if (directMatch) {
                const hour = parseInt(directMatch[1]);
                const minute = parseInt(directMatch[2]);
                return `${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;
            }
            
            // Hour only: 14点, 15点
            const hourOnlyMatch = text.match(/(\d{1,2})\u70b9/);
            if (hourOnlyMatch) {
                const hour = parseInt(hourOnlyMatch[1]);
                return `${String(hour).padStart(2,'0')}:00`;
            }
            
            // Chinese time expressions
            let hour = null;
            let minute = 0;
            
            // Check for half (半)
            if (text.includes('半')) {
                minute = 30;
            }
            
            // Extract hour number
            const hourMatch = text.match(/(\d{1,2})/);
            if (hourMatch) {
                hour = parseInt(hourMatch[1]);
            }
            
            if (hour === null) return null;
            
            // Determine AM/PM
            if (text.includes('下午') || text.includes('晚上')) {
                if (hour < 12) hour += 12;
            } else if (text.includes('早上') || text.includes('上午')) {
                // Keep as is (AM)
            } else if (text.includes('中午')) {
                if (hour < 12) hour += 12;
            }
            
            // If hour is 1-6 and no AM/PM specified, could be afternoon for baby feeding context
            // But let's be conservative and keep as is unless specified
            
            return `${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;
        }
        
        function extractDateFromText(text) {
            const today = new Date();
            
            if (text.includes('昨天')) {
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                return yesterday.toISOString().split('T')[0];
            } else if (text.includes('前天')) {
                const dayBefore = new Date(today);
                dayBefore.setDate(dayBefore.getDate() - 2);
                return dayBefore.toISOString().split('T')[0];
            } else if (text.includes('大前天')) {
                const threeDaysAgo = new Date(today);
                threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);
                return threeDaysAgo.toISOString().split('T')[0];
            }
            
            // Match specific date: "5月30号", "5月30日"
            const dateMatch = text.match(/(\d{1,2})\u6708(\d{1,2})[\u53f7\u65e5]/);
            if (dateMatch) {
                const month = parseInt(dateMatch[1]) - 1; // 0-indexed
                const day = parseInt(dateMatch[2]);
                const year = today.getFullYear();
                const date = new Date(year, month, day);
                return date.toISOString().split('T')[0];
            }
            
            return null;
        }
        
        // Initialize voice on load
        document.addEventListener('DOMContentLoaded', function() {
            initVoice();
        });
        // Close modal when clicking outside
        document.getElementById('recordModal').addEventListener('click', function(e) {
            if (e.target === this) hideModal();
        });
    </script>
